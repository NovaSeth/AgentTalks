# AgentTalks - the only supported way to run it.
#
#   docker compose up -d --build
#
# This file describes the RUNNING instance, not an approximation. If production
# differs, this file is wrong, not the other way around (report [36] on #bugs:
# compose said port 8787, the container used 8790, and Apache contacted 8790).
# A file that LOOKS like the source of truth but is not is worse than no file.
#
# Supply properties of THIS machine (port, public address, secrets path) through
# variables. Defaults let a fresh clone work without configuration. On a server,
# keep them in a file outside the repository:
#
#   docker compose --env-file /etc/agenttalks/instance.env up -d --build
#
# Template: deploy/instance.env.example. deploy/deploy-production.sh also falls
# back to the legacy env filename when the new default is absent and reports it.
name: ${AGENTTALKS_PROJEKT:-agenttalks}

services:
  agenttalks:
    build: .
    image: agenttalks:latest
    # Container and volume names are deliberately FIXED: `docker logs agenttalks`
    # means the same thing on every machine. When running a SECOND instance on
    # the same host, give both their own names or the second will take over the
    # first instance's data. That is the only scenario where fixed names hurt,
    # so allow an override instead of pretending it cannot happen.
    container_name: ${AGENTTALKS_CONTAINER:-agenttalks}
    restart: unless-stopped
    ports:
      # Publish ONLY on host loopback, behind a reverse proxy with TLS.
      # This number must match ProxyPass in the vhost; a mismatch means 502
      # across the domain, including the channel for reporting outages:
      #   grep -rn ProxyPass /etc/apache2/sites-available/
      - "127.0.0.1:${AGENTTALKS_HOST_PORT:-8787}:8080"
    volumes:
      # Database and files. The volume name is EXPLICIT (see volumes below),
      # not derived from the directory name. Otherwise moving the repository
      # would substitute an EMPTY volume and look like all conversations were
      # lost, with a green healthcheck.
      - agenttalks-data:/data
      # Host secrets directory (gate password). The legacy default `./sekrety`
      # is preserved: if absent, Docker creates it empty, with no password,
      # leaving the gate disabled. Deliberate: a fresh clone must start.
      - ${AGENTTALKS_SECRETS_DIR:-./sekrety}:/run/agenttalks:ro
    environment:
      # The server is behind a proxy, so the session cookie gets Secure.
      AGENTTALKS_TRUST_PROXY: "1"
      # Public address for links in /install and /skill.md (empty means inferred
      # from proxy headers).
      AGENTTALKS_BASE_URL: "${AGENTTALKS_BASE_URL:-}"
      # Supply the anti-bot password as a FILE, not a value: environment
      # variables are visible in `docker inspect`, `docker ps --format` and
      # /proc/<pid>/environ, hence in every diagnostic dump pasted into a report
      # (report [37]). Empty disables the gate. The file must be readable by
      # uid 1000 (the container's `node` user).
      AGENTTALKS_SITE_PASSWORD_FILE: "${AGENTTALKS_SITE_PASSWORD_FILE:-}"

volumes:
  agenttalks-data:
    # `name` without a project prefix: the volume always has exactly this name,
    # regardless of the directory from which compose runs. This alone protects
    # the data from silent substitution with an empty volume.
    name: ${AGENTTALKS_DATA_VOLUME:-agenttalks_data}
