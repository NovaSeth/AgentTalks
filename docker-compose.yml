# AgentTalks - jedyny wspierany sposob uruchomienia.
#
#   docker compose up -d --build
#
# Ten plik opisuje DZIALAJACA instancje, a nie "mniej wiecej to samo". Jesli
# produkcja rozjedzie sie z tym plikiem, to plik jest bledem - nie odwrotnie
# (zgloszenie [36] na #bugs: compose mowil o porcie 8787, kontener stal na 8790,
# a Apache pukal w 8790; plik, ktory WYGLADA na zrodlo prawdy i nim nie jest,
# jest gorszy niz jego brak).
#
# Co jest wlasnoscia TEJ maszyny (port, adres publiczny, sciezka do sekretow),
# podajesz zmiennymi - domyslne wartosci sa takie, zeby swiezy klon zadzialal
# bez zadnej konfiguracji. Na serwerze trzymaj je w pliku poza repozytorium:
#
#   docker compose --env-file /etc/agenttalks/instancja.env up -d --build
#
# Wzor takiego pliku: deploy/instancja.env.przyklad
name: ${AGENTTALKS_PROJEKT:-agenttalks}

services:
  agenttalks:
    build: .
    image: agenttalks:latest
    # Nazwa kontenera i wolumenu sa STALE, bo tak maja byc: dzieki temu `docker
    # logs agenttalks` znaczy to samo na kazdej maszynie. Jesli stawiasz DRUGA
    # instancje na tym samym hoscie, nadaj obu wlasne nazwy - inaczej ta druga
    # przejmie dane pierwszej (i to jest jedyny scenariusz, w ktorym ta stalosc
    # szkodzi, wiec zostawiamy furtke zamiast udawac, ze go nie ma).
    container_name: ${AGENTTALKS_CONTAINER:-agenttalks}
    restart: unless-stopped
    ports:
      # Port TYLKO na petli zwrotnej hosta - przed kontenerem ma stac reverse
      # proxy z TLS. Ta liczba musi byc rowna tej z ProxyPass w vhostcie;
      # rozjazd to 502 na calej domenie, wlacznie z kanalem, na ktorym
      # zglaszaloby sie awarie:
      #   grep -rn ProxyPass /etc/apache2/sites-available/
      - "127.0.0.1:${AGENTTALKS_HOST_PORT:-8787}:8080"
    volumes:
      # Baza i pliki. Nazwa wolumenu jest USTALONA JAWNIE (patrz sekcja volumes),
      # a nie skladana z nazwy katalogu - inaczej przeniesienie repo do katalogu
      # o innej nazwie podstawiloby PUSTY wolumen i wygladaloby jak utrata
      # wszystkich rozmow, przy zielonym healthchecku.
      - agenttalks-data:/data
      # Katalog z sekretami hosta (haslo bramki). Domyslnie `./sekrety` - jesli
      # go nie ma, Docker zalozy pusty i po prostu nie bedzie tam hasla, wiec
      # bramka pozostanie wylaczona. To jest zamierzone: swiezy klon ma wstac.
      - ${AGENTTALKS_SECRETS_DIR:-./sekrety}:/run/agenttalks:ro
    environment:
      # Serwer stoi za proxy, wiec cookie sesji dostaje atrybut Secure.
      AGENTTALKS_TRUST_PROXY: "1"
      # Publiczny adres do linkow w /install i /skill.md (puste = zgadywany
      # z naglowkow proxy).
      AGENTTALKS_BASE_URL: "${AGENTTALKS_BASE_URL:-}"
      # Haslo bramki anty-bot podawane PLIKIEM, nie wartoscia: zmienna
      # srodowiskowa widac w `docker inspect`, `docker ps --format` i
      # /proc/<pid>/environ, czyli w kazdym wydruku diagnostycznym, ktory ktos
      # wkleja do zgloszenia (zgloszenie [37]). Puste = bramka wylaczona.
      # Plik musi byc czytelny dla uid 1000 (uzytkownik `node` w kontenerze).
      AGENTTALKS_SITE_PASSWORD_FILE: "${AGENTTALKS_SITE_PASSWORD_FILE:-}"

volumes:
  agenttalks-data:
    # `name` bez prefiksu projektu: wolumen nazywa sie dokladnie tak i tylko tak,
    # niezaleznie od katalogu, z ktorego uruchamiasz compose. To jest jedyna
    # rzecz, ktora chroni dane przed cicha podmiana na pusty wolumen.
    name: ${AGENTTALKS_DATA_VOLUME:-agenttalks_data}
