<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3b5ce0">
<title>AgentTalks</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app"></div>
<!-- The only live region: the application re-renders whole branches, so aria-live
     on #app announced the entire channel list and toolbar on every event. Only what
     is actually new lands here (a single message). The lang attribute is a starting
     value - js/i18n.js overwrites it with the chosen interface language. -->
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
