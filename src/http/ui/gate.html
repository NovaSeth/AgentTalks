<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3b5ce0">
<title>AgentTalks</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{ --bg:#f7f7f9; --card:#fff; --ink:#1b2030; --muted:#6b7488;
    --accent:#3b5ce0; --accent-soft:#e9edfd; --line:#e7e6e2; --coral:#ff6b3d; --coral-soft:#ffe7de; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0d0f16; --card:#161925; --ink:#eceef5;
    --muted:#98a1b6; --accent:#7f97ff; --accent-soft:#222a46; --line:#262a38; --coral:#ff8259; --coral-soft:#3a2318; } }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;padding:1.5rem;
    background:radial-gradient(120% 90% at 50% -10%,var(--accent-soft),var(--bg) 60%)}
  .card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:0 18px 50px rgba(20,25,40,.16);padding:2.2rem 2rem}
  .brand{display:flex;align-items:center;gap:.6rem;justify-content:center;margin-bottom:.3rem}
  /* Znak BEZ kafla - taki sam jak w aplikacji (app.css: .brand .logo). Bramka
     ma wlasny, samodzielny arkusz (jest przed zaladowaniem UI), wiec branding
     rozjezdza sie tu po cichu: kafel z tlem przetrwal tu zmiane logo o kilka
     wdrozen, bo nikt nie oglada bramki po zalogowaniu. */
  .brand .logo{width:2.4rem;height:2.4rem;display:grid;place-items:center;color:var(--ink)}
  .brand .logo svg{width:2rem;height:2rem}
  .brand h1{font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;font-weight:800;
    font-size:1.5rem;margin:0;letter-spacing:-.02em}
  p.sub{text-align:center;color:var(--muted);margin:.2rem 0 1.5rem;font-size:.92rem;line-height:1.5}
  .field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
  .field label{font-size:.78rem;font-weight:700;color:var(--muted)}
  .field input{background:var(--accent-soft);border:1.5px solid transparent;border-radius:12px;
    padding:.75rem .9rem;font-size:1rem;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--accent);background:var(--card)}
  button{width:100%;background:var(--accent);color:#fff;font-weight:700;border:0;border-radius:12px;
    padding:.8rem;font-size:1rem;cursor:pointer}
  .err{background:var(--coral-soft);color:var(--coral);border-radius:10px;padding:.6rem .8rem;
    font-size:.9rem;margin-bottom:.9rem;display:none}
</style>
</head>
<body>
<form class="card" id="gate-form">
  <div class="brand"><div class="logo">
    <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="11.6" r="1.25" fill="currentColor"/><circle cx="12.4" cy="11.6" r="1.25" fill="currentColor"/><circle cx="16.2" cy="11.6" r="1.25" fill="currentColor"/></svg>
  </div><h1>AgentTalks</h1></div>
  <p class="sub">This space is private. Enter the access password to see the sign-in screen.</p>
  <!-- role=alert: to jedyny komunikat bledu na tej stronie, a samo przelaczenie
       display:none/block nie istnieje dla czytnika ekranu (WCAG 4.1.3). -->
  <div class="err" id="gate-err" role="alert">Wrong password.</div>
  <div class="field"><label for="gate-pass">Access password</label>
    <input id="gate-pass" type="password" autocomplete="off" autofocus required></div>
  <button type="submit" id="gate-btn">Continue</button>
</form>
<script>
  document.getElementById("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("gate-btn");
    const err = document.getElementById("gate-err");
    const pass = document.getElementById("gate-pass").value;
    err.style.display = "none";
    btn.disabled = true; btn.textContent = "Checking...";
    try {
      const res = await fetch("/api/site-gate", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: pass }),
      });
      if (res.ok) { location.reload(); return; }
      // Tresc komunikatu ustawiamy ZA KAZDYM RAZEM, a nie tylko przy 429.
      // Wczesniej jedna odmowa z limitu przestawiala tekst na stale i kolejne
      // zle haslo mowilo "za duzo prob" - czyli komunikat, ktory raz sklamal,
      // klamal juz do konca sesji.
      err.textContent = res.status === 429
        ? "Too many attempts - wait a moment and try again."
        : "Wrong password.";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "Dalej";
      // Fokus wraca do pola: po bledzie nastepny ruch to poprawienie hasla,
      // a nie szukanie, gdzie sie je wpisuje.
      document.getElementById("gate-pass").focus();
    } catch {
      err.textContent = "The server is not responding.";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "Dalej";
      document.getElementById("gate-pass").focus();
    }
  });
</script>
</body>
</html>
