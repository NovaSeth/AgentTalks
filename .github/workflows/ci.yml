name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: CI only reads the repository. Without this block the
# default depends on repository settings, which nobody sees from the workflow file.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      # A hard gate, not information. This step used to have
      # continue-on-error: true because tsc had not checked the repo and the
      # number of failing files was unknown. There were 7: two real gaps
      # (the "notification" event kind missing from Event; search dropping
      # resolvedAt/fixedAt, making closed reports look open). The rest was
      # noise from missing @types/node that hid those two. Now it passes
      # cleanly, it must block failures or it is decoration nobody reads.
      - name: Sprawdzenie typow
        run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t agenttalks:ci .
      - name: Smoke - kontener wstaje i odpowiada
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 agenttalks:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
