name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Projekt NIE MA typescript w zaleznosciach (i nie ma go dodawac do
      # dependencies - zero-zaleznosciowa zasada rdzenia). Instalujemy go
      # doraznie tylko na czas tego kroku. continue-on-error: true w
      # PIERWSZEJ wersji tego kroku, bo repo nie bylo dotad sprawdzane
      # przez tsc i nie wiadomo, ile istniejacych plikow zawiedzie -
      # wlaczenie tego jako twardej bramki od razu zaczerwieniloby CI bez
      # ostrzezenia. Usunac continue-on-error, gdy `tsc --noEmit` przechodzi
      # czysto na biezacym kodzie.
      - name: Sprawdzenie typow (informacyjne, na razie)
        continue-on-error: true
        run: npx -y -p typescript@5 tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agenttalks:ci .
      - name: Smoke - kontener wstaje i odpowiada
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 agenttalks:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
