name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Twarda bramka, nie informacja. Wczesniej ten krok mial
      # continue-on-error: true, bo repo nie bylo dotad sprawdzane przez tsc i
      # nie wiadomo bylo, ile plikow zawiedzie. Odpowiedz brzmiala: 7 - z czego
      # dwa byly prawdziwymi dziurami (rodzaj zdarzenia "notification" spoza
      # unii Event; wyszukiwarka gubiaca resolvedAt/fixedAt, wiec domkniete
      # zgloszenie wygladalo na otwarte). Reszta to szum z braku @types/node,
      # ktory maskowal tamte dwa. Odkad przechodzi czysto, ma byc bramka -
      # inaczej jest ozdoba, ktora nikt nie czyta.
      - name: Sprawdzenie typow
        run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agenttalks:ci .
      - name: Smoke - kontener wstaje i odpowiada
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 agenttalks:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
